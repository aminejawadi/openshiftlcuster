---
# ---------------------------------------------------------------------------
# Cluster identity
# ---------------------------------------------------------------------------
cluster_name: okd
# ".internal" is reserved for private networks, so it never clashes with real DNS.
base_domain: lab.internal
cluster_domain: "{{ cluster_name }}.{{ base_domain }}"

# ---------------------------------------------------------------------------
# OKD release (https://github.com/okd-project/okd/releases)
# ---------------------------------------------------------------------------
okd_version: "5.0.0-okd-scos.1"
okd_download_url: "https://github.com/okd-project/okd/releases/download/{{ okd_version }}"

# OKD does not need a Red Hat pull secret; this placeholder is the documented one.
pull_secret: '{"auths":{"fake":{"auth":"aWQ6cGFzcwo="}}}'

# ---------------------------------------------------------------------------
# Hypervisor: detected from the helper VM itself (virtualbox or vmware).
# Force it with -e hypervisor=virtualbox or -e hypervisor=vmware.
# ---------------------------------------------------------------------------
hypervisor: "{{ 'virtualbox' if (ansible_facts.virtualization_type | default('') | lower) == 'virtualbox' else 'vmware' }}"

# ---------------------------------------------------------------------------
# Lab network: the network the helper and the OKD VM share, and that your PC
# can reach to open the console.
#
# VirtualBox: a host-only network (default 192.168.56.0/24, your PC is .1).
#   Host-only has no internet, so the helper also routes the OKD VM out
#   through its own NAT adapter. Must match VBOX_SUBNET in the Vagrantfile.
# VMware: the NAT network VMnet8, detected from the helper's own address.
#   VMware uses .1 for your PC, .2 for its NAT router/DNS, .128-.254 for DHCP.
# ---------------------------------------------------------------------------
virtualbox_subnet: "192.168.56"
lab_subnet: >-
  {{ virtualbox_subnet if hypervisor == 'virtualbox'
     else ansible_facts.default_ipv4.address.split('.')[:3] | join('.') }}
network_prefix: 24
network_cidr: "{{ lab_subnet }}.0/{{ network_prefix }}"
helper_ip: "{{ lab_subnet }}.10"   # Vagrant sets this up; by hand, give the helper this IP
sno_ip: "{{ lab_subnet }}.50"
# Default gateway for the OKD VM: the helper on VirtualBox, VMware's NAT router on VMware.
gateway_ip: "{{ helper_ip if hypervisor == 'virtualbox' else lab_subnet ~ '.2' }}"
# Where the helper's dnsmasq sends names it doesn't own: the helper's own resolver
# (VirtualBox NAT DNS 10.0.2.3, or VMware's .2).
upstream_dns: >-
  {{ (ansible_facts.dns.nameservers | default([])
      | reject('in', [helper_ip, '127.0.0.1', '::1']) | list + [lab_subnet ~ '.2']) | first }}

# ---------------------------------------------------------------------------
# The OKD VM. Sized for a 64 GB PC with a 6-core / 12-thread CPU
# (Ryzen 5 7500F). Single-node minimums are 8 vCPU, 16 GB RAM, 120 GB disk.
# ---------------------------------------------------------------------------
vm_name: okd-sno
sno_hostname: sno
sno_vcpus: 8
sno_memory_mb: 32768
sno_disk_gb: 150
# Fixed MAC so the installer can match the static IP config to the VM's NIC.
# VirtualBox's prefix is 08:00:27; VMware's static range is 00:50:56:00:00:00-3F:FF:FF.
sno_mac: "{{ '08:00:27:2A:00:50' if hypervisor == 'virtualbox' else '00:50:56:2A:00:50' }}"
# First NIC name inside the VM: PCI slot 3 on VirtualBox, slot 160 (vmxnet3) on VMware.
sno_interface: "{{ 'enp0s3' if hypervisor == 'virtualbox' else 'ens160' }}"

# ---------------------------------------------------------------------------
# Cluster networking
# ---------------------------------------------------------------------------
network_type: OVNKubernetes
cluster_network_cidr: 10.128.0.0/14
cluster_network_host_prefix: 23
service_network_cidr: 172.30.0.0/16

# ---------------------------------------------------------------------------
# Helper web server (serves the ISO and the Windows script)
# ---------------------------------------------------------------------------
http_port: 8080
web_root: /var/www/html/okd

# ---------------------------------------------------------------------------
# Local paths (on the helper). Vagrant overrides bin_dir and install_dir so the
# installer works on the VM's own disk rather than the shared folder.
# ---------------------------------------------------------------------------
project_root: "{{ playbook_dir }}/.."
bin_dir: "{{ project_root }}/bin"
install_dir: "{{ project_root }}/install/{{ cluster_name }}"
ssh_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
oc_env:
  KUBECONFIG: "{{ install_dir }}/auth/kubeconfig"
  PATH: "{{ bin_dir }}:{{ lookup('env', 'PATH') }}"

# Names written to the Windows hosts file so your browser can reach the cluster.
# Add a line here for each route you create, then rerun 02-agent-iso.yml and
# the script with -UpdateHosts.
windows_host_names:
  - "api.{{ cluster_domain }}"
  - "console-openshift-console.apps.{{ cluster_domain }}"
  - "oauth-openshift.apps.{{ cluster_domain }}"
  - "downloads-openshift-console.apps.{{ cluster_domain }}"
  - "canary-openshift-ingress-canary.apps.{{ cluster_domain }}"
  - "default-route-openshift-image-registry.apps.{{ cluster_domain }}"

# The ISO's certificates expire 24h after it is built. Set true to rebuild it.
regenerate_iso: false
