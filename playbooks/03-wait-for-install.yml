---
- name: Follow the installation to the end
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Wait for the node to answer on the API port
      ansible.builtin.wait_for:
        host: "{{ sno_ip }}"
        port: 6443
        timeout: 2700
        sleep: 15

    - name: How to watch the install
      ansible.builtin.debug:
        msg: >-
          The next two steps can run for hours on a slow connection and print
          nothing while they wait. To watch the installer's own messages, run in
          another terminal: vagrant ssh -c 'tail -f {{ install_dir }}/.openshift_install.log'

    # Each openshift-install wait-for gives up after its own timeout (40 minutes
    # for install-complete) even though the cluster keeps installing, so retry.
    - name: Wait for bootstrap to complete
      ansible.builtin.command: >-
        {{ bin_dir }}/openshift-install agent wait-for bootstrap-complete
        --dir {{ install_dir }} --log-level info
      environment:
        PATH: "{{ bin_dir }}:{{ lookup('env', 'PATH') }}"
      register: _bootstrap
      until: _bootstrap.rc == 0
      retries: "{{ wait_bootstrap_retries | default(3) }}"
      delay: 30
      changed_when: false

    # OKD's OperatorHub lists Red Hat's catalogs too, but their images need a real
    # Red Hat pull secret. Without one, the node retries the pulls forever and
    # eats the bandwidth the rest of the install needs.
    - name: Turn off the Red Hat operator catalogs (they need a Red Hat pull secret)
      ansible.builtin.command: >-
        {{ bin_dir }}/oc patch operatorhub cluster --type merge -p
        '{"spec":{"sources":[{"name":"redhat-operators","disabled":true},
        {"name":"certified-operators","disabled":true},
        {"name":"redhat-marketplace","disabled":true},
        {"name":"community-operators","disabled":true}]}}'
      environment: "{{ oc_env }}"
      register: _catalogs
      until: _catalogs.rc == 0
      retries: 20
      delay: 30
      changed_when: "'patched' in _catalogs.stdout and 'no change' not in _catalogs.stdout"
      when: disable_redhat_catalogs | default(true) | bool

    - name: Wait for the installation to complete
      ansible.builtin.command: >-
        {{ bin_dir }}/openshift-install agent wait-for install-complete
        --dir {{ install_dir }} --log-level info
      environment:
        PATH: "{{ bin_dir }}:{{ lookup('env', 'PATH') }}"
      register: _install
      until: _install.rc == 0
      retries: "{{ wait_install_retries | default(6) }}"   # about 4.5 hours in total
      delay: 30
      changed_when: false

    - name: Show cluster status
      ansible.builtin.command: oc get clusterversion,nodes
      environment: "{{ oc_env }}"
      register: _status
      changed_when: false

    - name: Read the kubeadmin password
      ansible.builtin.slurp:
        src: "{{ install_dir }}/auth/kubeadmin-password"
      register: _password

    - name: Cluster access details
      ansible.builtin.debug:
        msg:
          - "{{ _status.stdout_lines }}"
          - "Console:  https://console-openshift-console.apps.{{ cluster_domain }}"
          - "User:     kubeadmin"
          - "Password: {{ _password.content | b64decode | trim }}"
          - "CLI:      export KUBECONFIG={{ install_dir }}/auth/kubeconfig"
